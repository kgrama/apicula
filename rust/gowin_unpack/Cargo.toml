[package]
name = "gowin_unpack"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
xz2 = "0.1"
indexmap = { version = "2", features = ["serde"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
